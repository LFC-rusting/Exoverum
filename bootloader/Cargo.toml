[package]
name = "bootloader"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "bootloader"
path = "src/lib.rs"

# Alvo binario explicito: gera `bootloader.efi` no target x86_64-unknown-uefi.
# Sem declarar, o cargo autodetecta src/main.rs, o que funciona mas deixa a
# intencao implicita. Explicitar e KISS.
[[bin]]
name = "bootloader"
path = "src/main.rs"
# Bin = `no_std + no_main + #[panic_handler]` (target uefi). Em test build
# (`cargo test`/`cargo clippy --all-targets`), o harness do test injeta `std`
# que ja define `panic_impl` -> duplicate lang item. Bin nao tem testes
# (logica testavel vive em [lib]); desabilitar tests do bin resolve sem
# remover o panic handler real.
test = false
bench = false
doctest = false

[dependencies]
bootinfo = { path = "../crates/bootinfo" }
