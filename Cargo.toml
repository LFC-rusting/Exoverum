[workspace]
members = [
    "bootloader",
    "kernel",
    "crates/bootinfo",
]
# `cargo build` no workspace root usa o target default (uefi). Kernel nao
# linka como uefi (entry = kernel_start, nao efi_main). Limitar default
# ao bootloader; kernel via alias `cargo build-kernel` ou via Makefile.
default-members = ["bootloader"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Projeto Exokernel"]
license = "Unlicense"
publish = false

[workspace.dependencies]
bootinfo = { path = "crates/bootinfo" }

[profile.release]
opt-level = "z" # minimiza tamanho
lto = "fat"     # LTO completo para eliminar lixo
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.dev]
panic = "abort"
opt-level = 1
