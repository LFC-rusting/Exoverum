[package]
name = "kernel"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

# Binario ELF carregado pelo bootloader em endereco fixo definido em linker.ld.
[[bin]]
name = "kernel"
path = "src/main.rs"
# Mesma justificativa do bootloader: bin tem `#[panic_handler]` proprio que
# colide com `std::panic_impl` em test builds. Logica testavel vive em [lib].
test = false
bench = false
doctest = false

[dependencies]
bootinfo = { path = "../crates/bootinfo" }

